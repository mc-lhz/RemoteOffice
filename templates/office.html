<!doctype html>
<html lang="{{ config.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>在线 Office 编辑器</title>
  <link rel="stylesheet" href="{{ url_for('office_bp.static', filename='office.css') }}">
</head>
<body>
  <header class="officeBar">
    <div class="officeTitle">
      <span class="officeMark">OFFICE</span>
      <span id="fileName">{{ config.fileName or '在线 Office 编辑器' }}</span>
    </div>
    <div class="officeActions">
      <span id="dirtyBadge" class="dirtyBadge" hidden>未保存</span>
      <button id="saveButton" type="button" disabled>保存</button>
      <button id="downloadButton" type="button" class="secondary" disabled>下载</button>
      <button id="reloadButton" type="button" class="secondary">重新加载</button>
    </div>
  </header>

  <main class="officeMain">
    <section id="emptyState" class="emptyState" {% if config.filePath %}hidden{% endif %}>
      <h1>打开本地文档</h1>
      <div class="pathRow">
        <input id="pathInput" type="text" placeholder="输入文件夹路径浏览，或文件路径直接打开" spellcheck="false">
        <button id="openPathButton" type="button">打开</button>
      </div>
      <p id="emptyError" class="errorText">{{ config.error or '' }}</p>
      <div id="fileManager" class="fileManager">
        <div class="fmToolbar">
          <button id="fmUp" type="button" class="textButton" title="返回上级">↑ 上级</button>
          <span id="fmPath" class="fmPath" title="">此电脑</span>
          <button id="fmRefresh" type="button" class="textButton" title="刷新当前目录">刷新</button>
        </div>
        <div id="fmList" class="fmList" role="list"></div>
        <div id="fmFoot" class="fmFoot" hidden></div>
      </div>
      <div id="recentFiles" class="recentFiles" hidden>
        <div class="recentHead">
          <h2>最近打开</h2>
          <button id="recentClear" type="button" class="textButton">清除记录</button>
        </div>
        <ul id="recentList" class="recentList"></ul>
      </div>
      {% if not config.distReady %}
      <p class="errorText">未找到 Office 静态资源，请先部署 office-dist。</p>
      {% endif %}
    </section>

    <iframe
      id="editorFrame"
      title="Office editor"
      {% if not config.filePath %}hidden{% endif %}
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </main>

  <footer class="officeStatus">
    <span id="statusText">准备就绪</span>
  </footer>

  <script>
    window.OFFICE_CONFIG = {{ config | tojson }};
  </script>
  <script src="{{ url_for('office_bp.static', filename='office.js') }}"></script>
</body>
</html>
